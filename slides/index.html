<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Machine-Learned Potentials Tutorial</title>
<meta name="description" content="Hands-on AIMNet2 tutorial. AiMat Summer School 2026, Machine Learning for Molecules.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Source+Code+Pro:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* ---- Carnegie Mellon core palette (brand.cmu.edu/visual-identity/colors) ---- */
:root{
  --red:#C41230;        /* Carnegie Red */
  --black:#000000;
  --iron:#6D6E71;       /* Iron Gray  */
  --steel:#E0E0E0;      /* Steel Gray */
  --white:#FFFFFF;
  --code-bg:#F6F6F7;

  --serif:"Source Serif 4","Source Serif Pro",Times,"Times New Roman",serif;
  --sans:"Open Sans",Helvetica,Arial,sans-serif;
  --mono:"Source Code Pro",ui-monospace,Menlo,Consolas,monospace;

  --W:1280px; --H:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--white);color:var(--black);
  font-family:var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#stageWrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{
  width:var(--W);height:var(--H);position:relative;
  transform-origin:center center;background:var(--white);
}

/* ---------------------------- slide shell ---------------------------- */
.slide{
  position:absolute;inset:0;padding:64px 80px 68px;
  display:none;flex-direction:column;
}
.slide.on{display:flex}
.slide.center{justify-content:center}

.eyebrow{
  font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red);margin-bottom:14px;
}
.eyebrow.grey{color:var(--iron)}
h1{font-family:var(--serif);font-size:62px;line-height:1.05;font-weight:700;letter-spacing:-.015em}
h2{
  font-family:var(--serif);font-size:42px;line-height:1.1;font-weight:600;
  letter-spacing:-.01em;padding-bottom:16px;margin-bottom:28px;
  border-bottom:3px solid var(--red);
}
h2.plain{border-bottom:0;padding-bottom:0;margin-bottom:20px}
h3{font-family:var(--sans);font-size:20px;font-weight:700;letter-spacing:-.005em}
p,li{font-size:21px;line-height:1.5;color:#1b1b1d}
.lead{font-size:26px;line-height:1.42;color:#1b1b1d;max-width:34em}
.sub{font-size:19px;color:var(--iron);line-height:1.5}
strong{font-weight:700}
em{font-style:normal;color:var(--red);font-weight:600}
ul{list-style:none;display:flex;flex-direction:column;gap:14px}
ul li{padding-left:26px;position:relative}
ul li::before{
  content:"";position:absolute;left:0;top:.62em;
  width:9px;height:9px;background:var(--red);
}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center}
.stack{display:flex;flex-direction:column;gap:18px}
.tight{gap:10px}


/* ---------------------------- structures ---------------------------- */
figure.mol{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0}
figure.mol .d{display:flex;align-items:center;justify-content:center}
figure.mol .d svg{max-width:100%;height:auto;display:block}
figure.mol figcaption{font-size:15px;color:var(--iron);text-align:center;line-height:1.3}
figure.mol figcaption code{font-size:14px}
figure.mol figcaption strong{color:#000}

.molgrid{display:grid;gap:10px 18px;align-items:end}
.molgrid.six{grid-template-columns:repeat(3,1fr)}
.molgrid.nine{grid-template-columns:repeat(3,1fr);gap:6px 14px}

.rxnrow{display:flex;align-items:center;justify-content:center;gap:16px}
.arrow{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px}
.arrow span{font-size:14px;color:var(--iron);letter-spacing:.02em}
.arrow::after{content:"";display:block;width:88px;height:0;
  border-top:2px solid var(--iron);position:relative}
.arrow::before{content:"";order:3;width:0;height:0;
  border-left:9px solid var(--iron);border-top:5px solid transparent;
  border-bottom:5px solid transparent;margin-left:86px;margin-top:-6px}

/* a pair of tautomers, side by side with a reversible arrow */
.pairgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px}
.pairbox{display:flex;flex-direction:column;gap:2px;border-top:2px solid var(--steel);padding-top:8px}
.pairbox.hi{border-top-color:var(--red)}
.pairbox .seat{font-family:var(--mono);font-size:13px;color:var(--red);font-weight:600}
.pairbox .nm{font-size:14px;line-height:1.25;color:#1b1b1d;min-height:2.5em}
.pairbox .two{display:flex;align-items:center;justify-content:center;gap:2px}
.pairbox .two svg{max-width:100%;height:auto}
.eq{font-size:17px;color:var(--iron);flex:none}


.rxnlist{display:flex;flex-direction:column;gap:2px}
.rxnitem{display:grid;grid-template-columns:72px 300px 1fr 90px;gap:16px;
  align-items:center;padding:4px 0;border-bottom:1px solid var(--steel)}
.rxnitem .seat{font-family:var(--mono);font-size:13px;color:var(--red);font-weight:600}
.rxnitem .sch{display:flex;align-items:center;justify-content:center}
.rxnitem .sch svg{width:100%;height:auto;max-height:76px}
.rxnitem .meta{display:flex;flex-direction:column;gap:1px;min-width:0}
.rxnitem .meta .t{font-size:18px;font-weight:600;color:#1b1b1d}
.rxnitem .meta .w{font-size:15px;color:var(--iron);line-height:1.3}
.rxnitem .nu{font-family:var(--mono);font-size:20px;text-align:right;
  font-variant-numeric:tabular-nums;color:#1b1b1d}

/* ---------------------------- components ---------------------------- */
code,.mono{font-family:var(--mono)}
pre{
  font-family:var(--mono);font-size:19px;line-height:1.62;
  background:var(--code-bg);border-left:4px solid var(--red);
  padding:20px 24px;white-space:pre;overflow:hidden;color:#1b1b1d;
}
pre b{font-weight:600;color:var(--black)}
pre i{font-style:normal;color:var(--iron)}
p code,li code,td code{
  font-size:.92em;background:var(--code-bg);padding:1px 6px;border-radius:2px;
}

table{border-collapse:collapse;width:100%;font-size:19px}
th{
  text-align:left;font-size:14px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--iron);
  padding:0 14px 9px 0;border-bottom:2px solid var(--black);white-space:nowrap;
}
td{padding:11px 14px 11px 0;border-bottom:1px solid var(--steel);vertical-align:top;line-height:1.35}
td:first-child{font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:22px}
th.asis{text-transform:none;letter-spacing:.02em;font-size:15px}
tr.hi td{background:#FCEEF0}

.chip{
  display:inline-block;font-size:14px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:5px 11px;background:var(--red);color:#fff;
}
.chip.ghost{background:transparent;color:var(--iron);border:1.5px solid var(--steel)}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{
  font-family:var(--serif);font-size:56px;font-weight:700;line-height:1;
  color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.stat .l{font-size:16px;color:var(--iron);line-height:1.35}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}

.callout{border-left:4px solid var(--red);padding:4px 0 4px 22px}
.callout .k{font-size:16px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red);margin-bottom:6px}

.rule{height:1px;background:var(--steel)}

/* activity slides: a red spine instead of a tint, so the ground stays white */
.slide.act{border-left:14px solid var(--red);padding-left:66px}

/* section dividers */
.divider{justify-content:center}
.divider .clock{
  font-family:var(--mono);font-size:22px;font-weight:600;color:var(--red);
  letter-spacing:.04em;margin-bottom:8px;
}
.divider h1{font-size:72px;max-width:20em}
.divider .note{font-size:22px;color:var(--iron);margin-top:22px;max-width:36em;line-height:1.45}

/* title slide */
.title-slide{justify-content:space-between}
.title-rule{width:120px;height:6px;background:var(--red);margin:30px 0 26px}
.wordmark{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.01em}
.wordmark span{color:var(--red)}

/* running furniture */
.foot{
  position:absolute;left:80px;right:80px;bottom:26px;
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:14px;color:var(--iron);letter-spacing:.02em;
}
.slide.act .foot{left:66px}
.foot .who{font-weight:600}
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--red);width:0;transition:width .18s ease}

/* overview */
#ov{position:fixed;inset:0;background:#fff;overflow:auto;padding:28px;display:none;z-index:40}
#ov.on{display:block}
#ov h4{font-family:var(--sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--iron);margin-bottom:16px}
#ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ovi{border:1px solid var(--steel);padding:12px 14px;cursor:pointer;background:#fff;text-align:left;font-family:var(--sans)}
.ovi:hover,.ovi:focus-visible{border-color:var(--red);outline:none}
.ovi .n{font-family:var(--mono);font-size:12px;color:var(--red);font-weight:600}
.ovi .t{font-size:14px;line-height:1.3;margin-top:4px;color:#1b1b1d}

#help{
  position:fixed;right:14px;top:12px;font-size:12px;color:var(--iron);
  font-family:var(--sans);z-index:30;background:#fff;padding:4px 8px;
  opacity:1;transition:opacity .6s ease;pointer-events:none;
}
#help.hide{opacity:0}
@media (max-width:700px){#help{display:none}}

@media print{
  @page{size:1280px 720px;margin:0}
  body,html{overflow:visible;height:auto}
  #stageWrap{position:static;display:block}
  #stage{transform:none!important;width:1280px;height:720px}
  .slide{display:flex!important;position:relative;page-break-after:always;width:1280px;height:720px}
  #help,#ov,#bar{display:none!important}
}
</style>
</head>
<body>
<div id="stageWrap"><div id="stage"></div></div>
<div id="ov"><h4>All slides — click to jump, Esc to close</h4><div id="ovg"></div></div>
<div id="help">← → navigate · O overview · F fullscreen · P print</div>

<script>
const FOOT = '<div class="foot"><span class="who">AIMNet2 &middot; AiMat Summer School 2026</span><span class="pg"></span></div>';

const SLIDES = [
`<div class="slide title-slide">
  <div class="wordmark">Carnegie Mellon University<span> · </span>Isayev Laboratory</div>
  <div>
    <div class="eyebrow">Hands-on tutorial · 90 minutes</div>
    <h1>Machine-learned potentials<br>for molecular chemistry</h1>
    <div class="title-rule"></div>
    <p class="sub" style="font-size:21px">
      <strong style="color:#000">Olexandr Isayev</strong> &nbsp;·&nbsp; Carnegie Mellon University<br>
      AiMat Summer School 2026 &mdash; <em>Machine Learning for Molecules</em> &nbsp;·&nbsp; Karlsruhe
    </p>
  </div>
  <div class="sub mono" style="font-size:17px">github.com/isayevlab/ml4mol2026-aimnet2</div>
</div>`,

`<div class="slide center" style="align-items:flex-start">
  <div class="eyebrow">Please do this before we begin</div>
  <h1 style="font-size:66px;margin-bottom:24px">Open notebook 0<br>and run the first cell.</h1>
  <div class="cols" style="width:100%">
    <p class="lead" style="font-size:23px">It takes about a minute. It installs the package and downloads the model parameters, once per machine, with no progress output.</p>
    <div class="stack tight">
      <p class="sub"><strong>On Colab:</strong> Runtime &rarr; Change runtime type &rarr; <strong>T4 GPU</strong>. Nothing to clone.</p>
      <p class="sub">Everything also runs on CPU, five to twenty times more slowly.</p>
    </div>
  </div>
  ${FOOT}
</div>`,

`<div class="slide">
  <div class="eyebrow grey">The central idea</div>
  <h2>Almost everything follows from one function</h2>
  <div class="cols" style="align-items:center">
    <div class="stack">
      <div class="callout">
        <div class="k">Potential energy surface</div>
        <p style="font-size:20px">For a molecule of <em>N</em> atoms, the potential energy <em>E</em> depends on the 3<em>N</em> coordinates of those atoms. The function <em>E</em>(<strong>R</strong>) is the potential energy surface.</p>
      </div>
      <p class="sub">Every structural, spectroscopic and kinetic property in this tutorial is a statement about the shape of that surface.</p>
    </div>
    <table>
      <tr><th>Feature of the surface</th><th>Chemical meaning</th></tr>
      <tr><td>a local minimum</td><td class="sub">a stable structure</td></tr>
      <tr><td>relative depths of minima</td><td class="sub">which form is populated</td></tr>
      <tr><td>curvature at a minimum</td><td class="sub">vibrational frequencies, the infrared spectrum</td></tr>
      <tr><td>a first-order saddle point</td><td class="sub">a transition state, an activation barrier</td></tr>
      <tr><td>motion on the surface</td><td class="sub">molecular dynamics</td></tr>
    </table>
  </div>
  ${FOOT}
</div>`,

`<div class="slide">
  <div class="eyebrow grey">Where the surface comes from</div>
  <h2>Quantum mechanics is accurate; it is also far too slow</h2>
  <div class="stack">
    <p class="lead">Solving the electronic Schr&ouml;dinger equation for every geometry is the correct procedure. Density functional theory makes it tractable, at seconds to hours per structure. Every task on the previous slide requires hundreds to millions of such evaluations.</p>
    <div class="callout">
      <div class="k">Machine-learned interatomic potential</div>
      <p style="font-size:20px">A model, here a neural network, trained to reproduce the energies and forces of a reference quantum chemistry method. It evaluates in milliseconds rather than minutes, at close to the accuracy of the method it was trained on.</p>
    </div>
    <p class="sub"><strong>AIMNet2</strong> was trained on approximately twenty million density functional calculations.</p>
  </div>
  ${FOOT}
</div>`,

`<div class="slide center">
  <div class="eyebrow">What distinguishes this model</div>
  <h1 style="font-size:54px;line-height:1.1;max-width:20em">
    Total charge and spin multiplicity are <em>inputs to the network</em>, and the partial charge distribution is an output.
  </h1>
  <p class="lead" style="margin-top:28px;color:var(--iron)">
    Most machine-learned potentials for organic molecules accept only atomic positions and atomic numbers, and are therefore defined only for neutral, closed-shell species. Anions, cations and radicals are inaccessible to them.
  </p>
  <p class="sub" style="margin-top:18px;font-size:20px">This is used directly in the final exercise, where reactivity is obtained from the energies and charges of a molecule with one electron added and one removed.</p>
  ${FOOT}
</div>`,

`<div class="slide">
  <div class="eyebrow grey">Definitions</div>
  <h2>Three quantities</h2>
  <div class="cols3">
    <div class="callout"><div class="k">Potential energy</div>
      <p class="sub" style="font-size:18px">A total electronic energy, measured relative to separated atoms. Reported in eV; 1 eV = 23.06 kcal/mol. Its absolute value carries no information. <strong>Only differences are meaningful.</strong></p></div>
    <div class="callout"><div class="k">Force</div>
      <p class="sub" style="font-size:18px"><strong>F</strong><sub>i</sub> = &minus;&part;<em>E</em>/&part;<strong>R</strong><sub>i</sub>, the direction in which an atom would move to lower the energy. In eV/&#197;. A structure with zero forces is a stationary point.</p></div>
    <div class="callout"><div class="k">Partial atomic charge</div>
      <p class="sub" style="font-size:18px">A division of the total electron density among the atoms, in units of <em>e</em>. Not a physical observable, but a standard descriptor of where electron density sits. Must sum to the total charge.</p></div>
  </div>
  <p class="sub" style="margin-top:26px"><strong>Useful reference scale.</strong> Thermal energy at room temperature is 0.59 kcal/mol. A hydrogen bond is about 5 kcal/mol. A carbon&ndash;carbon single bond is about 85 kcal/mol.</p>
  ${FOOT}
</div>`,

`<div class="slide">
  <div class="eyebrow grey">Definitions</div>
  <h2>Moving downhill</h2>
  <div class="cols">
    <div class="stack">
      <div class="callout"><div class="k">Local minimum</div>
        <p style="font-size:19px">A point at which all forces vanish and the energy rises in every direction. Physically, a stable structure.</p></div>
      <div class="callout"><div class="k">Geometry optimisation</div>
        <p style="font-size:19px">Iteratively moving atoms along the forces until the forces vanish. Each step costs one energy and force evaluation.</p></div>
    </div>
    <div class="stack">
      <div class="callout"><div class="k">Convergence criterion</div>
        <p style="font-size:19px">Stop when the largest force falls below a threshold, <code>fmax</code>. We use <strong>0.02 eV/&#197;</strong> throughout.</p></div>
      <table style="font-size:18px">
        <tr><th>Molecule</th><th class="num">Atoms</th><th class="num">Steps</th><th class="num">Time</th></tr>
        <tr><td>ethanol</td><td class="num">9</td><td class="num">17</td><td class="num">0.4 s</td></tr>
        <tr><td>caffeine</td><td class="num">24</td><td class="num">21</td><td class="num">0.4 s</td></tr>
        <tr><td>ibuprofen</td><td class="num">33</td><td class="num">26</td><td class="num">0.6 s</td></tr>
      </table>
      <p class="sub" style="font-size:16px">On a CPU. The same optimisations with a hybrid density functional would take minutes to hours each.</p>
    </div>
  </div>
  ${FOOT}
</div>`,

`<div class="slide act">
  <div class="eyebrow">Exercise 1 &middot; definitions</div>
  <h2 class="plain">Conformers and populations</h2>
  <div class="cols3">
    <div class="callout"><div class="k">Conformer</div>
      <p class="sub" style="font-size:18px">One of several structures of the same molecule differing only by rotation about single bonds. Distinct minima on the surface; not isomers, since no bonds differ.</p></div>
    <div class="callout"><div class="k">Conformational ensemble</div>
      <p class="sub" style="font-size:18px">The full set of accessible conformers with their relative energies. At room temperature a flexible molecule is a population, not a structure.</p></div>
    <div class="callout"><div class="k">Boltzmann distribution</div>
      <p class="sub" style="font-size:18px"><em>p<sub>i</sub></em> &prop; exp(&minus;<em>E<sub>i</sub></em>/<em>kT</em>), with <em>kT</em> = 0.59 kcal/mol at 298 K. One kcal/mol above the minimum is five times less populated; three kcal/mol is 150 times less.</p></div>
  </div>
  <div class="rule" style="margin:26px 0 20px"></div>
  <p class="sub"><strong>Procedure.</strong> Generate many trial structures with different torsions &rarr; optimise each &rarr; remove duplicates &rarr; apply the Boltzmann distribution. Duplicates are identified by comparing sorted interatomic distances, which are unchanged by translation and rotation.</p>
  ${FOOT}
</div>`,

  <h1>Molecular dynamics</h1>

`<div class="slide">
  <div class="eyebrow grey">Definitions and result</div>
  <h2>Integrating the equations of motion</h2>
  <div class="cols">
    <div class="stack tight">
      <div class="callout"><div class="k">Molecular dynamics</div>
        <p class="sub" style="font-size:18px">Numerical integration of Newton's equations using forces from the potential energy surface. The result is a trajectory.</p></div>
      <div class="callout"><div class="k">Timestep</div>
        <p class="sub" style="font-size:18px">Must be short compared with the fastest motion. X&ndash;H stretches occur on a 10<sup>&minus;14</sup> s timescale, so a timestep of 1 fs or less is required. Whether a given value is short <em>enough</em> is settled by measurement, not by convention: here 0.5 fs is not, and 0.25 fs is.</p></div>
      <div class="callout"><div class="k">Thermostat</div>
        <p class="sub" style="font-size:18px">Couples the system to a heat bath so that it samples structures at a chosen temperature rather than conserving its initial energy.</p></div>
    </div>

`<div class="slide">
  <div class="eyebrow">A test worth running on any new potential</div>
  <h2>Remove the thermostat and the potential has nowhere to hide</h2>
  <div class="cols" style="align-items:center">
    <div class="stack">
      <div class="callout"><div class="k">Constant-energy dynamics</div>
        <p style="font-size:19px">With no thermostat, the sum of kinetic and potential energy must be conserved. Two quantities, and the difference matters.</p></div>
      <div class="callout"><div class="k">Drift</div>
        <p class="sub" style="font-size:18px">The <em>slope</em> of the total energy against time. This is what must be zero, and it is: under 0.03 &micro;eV per step against 0.58 eV of thermal energy in the molecule. The forces really are the gradient of the energy.</p></div>
      <div class="callout"><div class="k">Fluctuation</div>
        <p class="sub" style="font-size:18px">The <em>spread</em> about that line. Not an error in the same sense, but it grows steeply with the timestep, and it is what makes a thermostat mis-set the temperature.</p></div>
    </div>
    <table>
      <tr><th class="num">Timestep</th><th class="num asis">Drift / &micro;eV per step</th><th class="num asis">Fluctuation / meV</th></tr>
      <tr><td class="num">1.00 fs</td><td class="num">0.03</td><td class="num">0.9</td></tr>
      <tr><td class="num">0.50 fs</td><td class="num">0.02</td><td class="num">0.2</td></tr>
      <tr class="hi"><td class="num">0.25 fs</td><td class="num">0.00</td><td class="num">0.1</td></tr>
    </table>
  </div>
  ${FOOT}
</div>`,

`<div class="slide divider">
  <div class="clock">notebook 5 &nbsp;·&nbsp; 10 minutes</div>
  <h1>Reactions and transition states</h1>
  <p class="note">Every structure so far has been a minimum. Chemistry is about the paths between them.</p>

`<div class="slide">
  <div class="eyebrow grey">Definitions</div>
  <h2>Saddle points</h2>
  <div class="cols">
    <div class="stack tight">
      <div class="callout"><div class="k">Transition state</div>
        <p class="sub" style="font-size:18px">The highest point along the lowest-energy path from reactants to products. A <strong>first-order saddle point</strong>: a maximum along exactly one direction, a minimum along all others.</p></div>
      <div class="callout"><div class="k">Activation barrier</div>
        <p class="sub" style="font-size:18px">The energy of the transition state relative to the reactants. At room temperature each additional 1.4 kcal/mol slows the reaction roughly tenfold.</p></div>
    </div>
    <div class="stack tight">
      <div class="callout"><div class="k">Hessian</div>
        <p class="sub" style="font-size:18px">The matrix of second derivatives &part;<sup>2</sup><em>E</em>/&part;<em>R</em><sub>i</sub>&part;<em>R</em><sub>j</sub>. It describes the curvature of the surface, and its eigenvalues give the vibrational frequencies.</p></div>
      <div class="callout"><div class="k">Imaginary frequency</div>
        <p class="sub" style="font-size:18px">A frequency from a <em>negative</em> Hessian eigenvalue, reported as a negative number. A minimum has none. A transition state has <strong>exactly one</strong>, and its motion is the reaction itself.</p></div>
    </div>
  </div>
  <p class="sub" style="margin-top:22px">AIMNet2 provides <strong>analytic</strong> second derivatives, obtained by differentiating the network twice in closed form. The alternative, finite differences, requires 6<em>N</em> additional gradient evaluations and a step size that must be chosen.</p>
  ${FOOT}
</div>`,

`<div class="slide act">
  <div class="eyebrow">Exercise 2 &middot; definitions</div>
  <h2 class="plain">From curvature to a spectrum</h2>
  <div class="cols3">
    <div class="callout"><div class="k">Normal mode</div>
      <p class="sub" style="font-size:18px">A collective vibration in which every atom oscillates at the same frequency. A non-linear molecule of <em>N</em> atoms has 3<em>N</em> &minus; 6 of them; the other six are translations and rotations, which must be projected out.</p></div>
    <div class="callout"><div class="k">Harmonic approximation</div>
      <p class="sub" style="font-size:18px">The assumption that the energy near a minimum is quadratic in the displacements. Good for small displacements; it systematically overestimates X&ndash;H stretches, which are strongly anharmonic.</p></div>
    <div class="callout"><div class="k">Infrared selection rule</div>
      <p class="sub" style="font-size:18px">A vibration absorbs only if it <strong>changes the molecular dipole moment</strong>. Intensity &prop; |&part;<strong>&mu;</strong>/&part;<em>Q</em>|<sup>2</sup>. A mode that moves atoms without changing the dipole is invisible, whatever its amplitude.</p></div>
  </div>
  <p class="sub" style="margin-top:26px">The dipole derivative is obtained numerically, from 6<em>N</em> additional single-point evaluations. Each costs milliseconds, so the whole spectrum of a small molecule takes under a second.</p>
  ${FOOT}
</div>`,

`<div class="slide act">
  <div class="eyebrow">Exercise 3 &middot; definitions</div>
  <h2 class="plain">Reactivity from three charge states</h2>
  <div class="cols">
    <div class="stack tight">
      <div class="callout"><div class="k">Ionisation potential and electron affinity</div>
        <p class="sub" style="font-size:18px"><em>I</em> = <em>E</em>(<em>N</em>&minus;1) &minus; <em>E</em>(<em>N</em>) and <em>A</em> = <em>E</em>(<em>N</em>) &minus; <em>E</em>(<em>N</em>+1), both at the geometry of the neutral molecule. A negative <em>A</em> means the isolated molecule does not bind an extra electron, which is usual in the gas phase.</p></div>
      <div class="callout"><div class="k">Electrophilicity index</div>
        <p class="sub" style="font-size:18px"><em>&omega;</em> = <em>&mu;</em><sup>2</sup>/2<em>&eta;</em>, with <em>&mu;</em> = &minus;(<em>I</em>+<em>A</em>)/2 and <em>&eta;</em> = <em>I</em>&minus;<em>A</em>. A single number for the whole molecule: it ranks reactivity but says nothing about position.</p></div>
    </div>
    <div class="callout"><div class="k">Fukui function</div>
      <p style="font-size:19px">The position-resolved counterpart, condensed onto atom <em>k</em>:</p>
      <p class="sub" style="font-size:18px;margin-top:10px"><em>f</em><sup>+</sup>(<em>k</em>) = <em>q</em>(<em>k</em>,<em>N</em>) &minus; <em>q</em>(<em>k</em>,<em>N</em>+1) &nbsp;&mdash;&nbsp; where added electron density goes. Large <em>f</em><sup>+</sup> marks the site of <strong>nucleophilic</strong> attack.</p>
      <p class="sub" style="font-size:18px;margin-top:8px"><em>f</em><sup>&minus;</sup>(<em>k</em>) = <em>q</em>(<em>k</em>,<em>N</em>&minus;1) &minus; <em>q</em>(<em>k</em>,<em>N</em>) &nbsp;&mdash;&nbsp; where density is most readily removed. Large <em>f</em><sup>&minus;</sup> marks the site of <strong>electrophilic</strong> attack.</p>
      <p class="sub" style="font-size:17px;margin-top:10px">Both require the ions, which are doublets. This exercise is only possible because charge and multiplicity are model inputs.</p>
    </div>
  </div>
  ${FOOT}
</div>`,

  <p class="sub" style="margin-top:18px">For the three <strong>activated</strong> rings, ortho and para clearly exceed meta: the textbook pattern. For the <strong>deactivated</strong> ring the descriptor places meta above ortho, capturing part of the effect, but para comes out highest where experiment gives meta.</p>
  <p class="sub" style="margin-top:10px"><strong>The reason matters.</strong> Condensed Fukui functions describe how the ground-state density redistributes on adding or removing an electron. Regioselectivity in aromatic substitution is governed by the relative energies of the <em>&sigma;</em>-complex intermediates, which is a different quantity. For activated rings the two correlate; for deactivated rings they need not. This is a screening method with a known failure mode, not a predictive one.</p>

/* ------------------------------ engine ------------------------------ */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('') + '<div id="bar"></div>';
const slides = [...stage.querySelectorAll('.slide')];
const bar = document.getElementById('bar');
let i = 0;

function titleOf(el){
  const h = el.querySelector('h1,h2');
  return h ? h.textContent.trim().replace(/\s+/g,' ').slice(0,72) : 'Slide';
}
function show(n, push=true){
  i = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, k) => s.classList.toggle('on', k === i));
  bar.style.width = ((i) / (slides.length - 1) * 100) + '%';
  const pg = slides[i].querySelector('.pg');
  if (pg) pg.textContent = (i + 1) + ' / ' + slides.length;
  if (push) history.replaceState(null, '', '#/' + (i + 1));
}
function fit(){
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  stage.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit);

const ov = document.getElementById('ov'), ovg = document.getElementById('ovg');
slides.forEach((s, k) => {
  const b = document.createElement('button');
  b.className = 'ovi';
  b.innerHTML = '<div class="n">' + (k + 1) + '</div><div class="t">' + titleOf(s) + '</div>';
  b.onclick = () => { ov.classList.remove('on'); show(k); };
  ovg.appendChild(b);
});

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (ov.classList.contains('on') && k !== 'o' && k !== 'escape') return;
  if (k === 'arrowright' || k === ' ' || k === 'pagedown' || k === 'n') { show(i + 1); e.preventDefault(); }
  else if (k === 'arrowleft' || k === 'pageup') show(i - 1);
  else if (k === 'home') show(0);
  else if (k === 'end') show(slides.length - 1);
  else if (k === 'o') ov.classList.toggle('on');
  else if (k === 'escape') ov.classList.remove('on');
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'p') print();
});
addEventListener('click', e => { if (!e.target.closest('#ov,#help')) show(i + 1); });

let tx = 0;
addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - tx;
  if (Math.abs(d) > 55) show(i + (d < 0 ? 1 : -1));
}, {passive:true});

// the hint is for the first few seconds only, then it gets out of the way
const help = document.getElementById('help');
let hideT = setTimeout(() => help.classList.add('hide'), 4000);
addEventListener('mousemove', () => {
  help.classList.remove('hide');
  clearTimeout(hideT);
  hideT = setTimeout(() => help.classList.add('hide'), 2500);
});

fit();
show(Math.max(0, (parseInt((location.hash.match(/\d+/) || [1])[0], 10) || 1) - 1), false);
</script>
